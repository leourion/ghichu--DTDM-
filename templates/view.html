{% extends "base.html" %}
{% block content %}
<article class="card"><h1>{{ note.title }}</h1>
  <p class="bodytext">{{ note.content or 'Chưa có nội dung' }}</p>
  <a class="button" href="{{ url_for('edit_note', note_id=note.id) }}">Sửa</a>
  <form class="inline" method="post" action="{{ url_for('delete_note', note_id=note.id) }}" onsubmit="return confirm('Xóa ghi chú này?')">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}"><button class="danger">Xóa</button>
  </form>
  <p><a href="{{ url_for('index') }}">← Danh sách</a></p>
</article>
{% endblock %}
